[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safefix"
version = "0.2.0"
description = "A coding-agent harness for repairing pytest failures"
requires-python = ">=3.11"
dependencies = [
  "prompt_toolkit>=3.0.43,<4",
  "rich>=13.7.1,<15",
]

[project.scripts]
safefix = "safefix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
